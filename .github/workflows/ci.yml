name: CI

# lint  -> the repo's pre-commit hooks
# tests -> school_suite's integration tests on a fresh site, with every app at the
#          versions pinned below
#
# Production runs on Frappe Cloud, which builds and deploys the apps itself. These
# pins are the versions school_suite is tested against: before deploying an app
# update on Frappe Cloud, bump its pin here and let CI pass (docs/deployment.md).

on:
  push:
    branches: [version-16, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.number }}
  cancel-in-progress: true

env:
  FRAPPE_BRANCH: v16.54.0
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: pre-commit/action@v3.0.1

  tests:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Init bench
        run: |
          pip install frappe-bench
          bench init --frappe-branch "$FRAPPE_BRANCH" --skip-redis-config-generation --skip-assets \
            --python "$(which python)" ~/frappe-bench

      # bench clones with `git clone --branch`, which takes a branch or a tag but not a
      # commit, so each app is pinned to a release tag (payments has no releases).
      - name: Get apps (pinned)
        working-directory: /home/runner/frappe-bench
        run: |
          get() { bench get-app --skip-assets --branch "$2" "$1"; }
          get https://github.com/frappe/erpnext                  v16.53.0
          get https://github.com/frappe/payments                 version-16-hotfix
          get https://github.com/frappe/hrms                     v16.53.0
          get https://github.com/frappe/education                v16.0.1
          get https://github.com/resilient-tech/india-compliance v16.11.0
          get https://github.com/frappe/lms                      v2.63.0
          bench get-app --skip-assets school_suite "$GITHUB_WORKSPACE"
          bench setup requirements --dev

      - name: Create test site
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext payments education hrms india_compliance lms school_suite
          bench build --app frappe
        env:
          CI: "Yes"

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app school_suite
        env:
          TYPE: server
